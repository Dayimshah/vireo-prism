# ===========================================================================
# Alembic configuration
#
# The database URL is intentionally absent from this file. alembic/env.py reads
# it from app.core.config at runtime, so credentials live only in the
# environment and there is exactly one source of truth for the DSN.
# ===========================================================================

[alembic]
script_location = alembic
prepend_sys_path = .

# Revision filenames sort chronologically and read like a changelog:
#   0001_20240817_1200-schemas_and_enums.py
file_template = %%(rev)s_%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(slug)s

# Timestamps in revision filenames use local time; UTC keeps them stable across
# contributors in different timezones.
timezone = UTC

# Truncate the slug portion of generated filenames.
truncate_slug_length = 48

# Run migrations inside a transaction where the backend supports it. Postgres
# does, which means a failed migration rolls back cleanly instead of leaving the
# schema half-applied.
transaction_per_migration = false

# Reformat autogenerated revisions so they pass the project's own lint rules.
hooks = ruff_fix, ruff_format

ruff_fix.type = console_scripts
ruff_fix.entrypoint = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------
# Logging
#
# Kept minimal: app.core.logging installs the real (structlog) pipeline when
# migrations run inside the API container. This section only covers the case of
# invoking `alembic` directly on a developer machine.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-8s [%(name)s] %(message)s
datefmt = %H:%M:%S
