# ===========================================================================
# nginx — static host for the compiled SPA.
#
# This server does NOT proxy the API. The browser talks to the API directly at
# VITE_API_BASE_URL, which is why the API sets CORS origins and `expose_headers`. A
# proxy here would make the dev server (cross-origin) and this image (same-origin)
# behave differently, so a CORS mistake would only ever appear in production.
# ===========================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Nothing here identifies a version worth advertising to a scanner.
    server_tokens off;

    # ----------------------------------------------------------------------
    # Compression
    #
    # gzip only. Brotli would compress this bundle ~15% smaller and needs a module the
    # official nginx:alpine image does not carry — adding a custom build for that is a
    # poor trade against a bundle already split into four chunks.
    # ----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ----------------------------------------------------------------------
    # Security headers
    #
    # No HSTS: this image is served over plain HTTP on localhost, and an HSTS header
    # would pin the browser to HTTPS for a host that does not speak it. It belongs on
    # whatever terminates TLS in a real deployment.
    # ----------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "no-referrer"    always;

    # `connect-src *` is the load-bearing relaxation: the API runs on a different origin
    # and port, and that origin is a build argument this file cannot know. Narrowing it
    # would mean templating this config per deployment.
    #
    # `style-src` needs 'unsafe-inline' because Recharts sets inline styles on the SVG
    # elements it renders; a nonce cannot reach them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src *; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ----------------------------------------------------------------------
    # Caching
    #
    # Two rules, and the split matters. Vite fingerprints every asset filename with a
    # content hash, so those files are immutable and cached for a year. index.html is
    # NOT fingerprinted — it is the document that names the current hashes, so caching
    # it would pin a returning visitor to the previous deploy's asset names, which are
    # gone. A stale index.html is the classic white-screen-after-deploy.
    # ----------------------------------------------------------------------
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Repeated because `add_header` in a location replaces the inherited set rather
        # than adding to it — without these, the document itself would ship with no
        # security headers at all.
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header Referrer-Policy        "no-referrer" always;
    }

    location = /favicon.svg {
        expires    7d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # ----------------------------------------------------------------------
    # SPA routing
    #
    # Client-side routes such as /retention are real URLs a reader can bookmark or
    # reload, and no file exists at that path. Falling back to index.html lets the
    # router resolve it. This returns 200 for a genuinely unknown path too, and the
    # router renders its own 404 there — correct for an SPA, where the server cannot
    # know the route table.
    # ----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A healthcheck that does not transfer the bundle. `access_log off` keeps a 15-second
    # interval from filling the log with its own probes.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }
}
