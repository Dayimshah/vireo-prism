<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Prism">
  <!-- A prism splitting one beam into a spectrum: white light in from the left, three
       coloured beams out to the right. The mark reads at 16px because the triangle is
       solid and the beams are thick. -->
