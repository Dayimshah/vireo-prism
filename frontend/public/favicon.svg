  <path d="M4 17.5h7" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round" />
  <path d="M16 6.5 26.5 24.5h-21z" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linejoin="round" />
  <path d="M20 14.5 28 11" stroke="#F472B6" stroke-width="2" stroke-linecap="round" />
  <path d="M20.5 17.5H29" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  <path d="M20 20.5 28 24" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
</svg>
